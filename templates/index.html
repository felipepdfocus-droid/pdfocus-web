<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFocus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --border: #e2e5ef;
      --fg: #0d0f1a;
      --fg2: #5a6072;
      --accent: #1a56db;
      --accent-h: #1445b8;
      --green: #0e9f6e;
      --blue: #1a56db;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--accent);
    }
    .brand span { color: var(--fg); }
    .empresa-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--fg2);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
    }
    .empresa-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
      gap: 32px;
    }

    /* ── SEARCH CARD ── */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
      width: 100%;
      max-width: 580px;
    }
    .search-card h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .search-card p {
      font-size: 0.85rem;
      color: var(--fg2);
      margin-bottom: 24px;
    }
    .search-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--fg);
      background: var(--bg);
      transition: border-color 0.15s;
      min-width: 0;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }
    .btn-search {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-search:hover { background: var(--accent-h); }
    .btn-search:disabled { opacity: 0.6; cursor: default; }

    /* Filtro de tipo */
    .tipo-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .tipo-btn {
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--fg2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tipo-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    /* ── ESTADO ── */
    #estado {
      font-size: 0.85rem;
      color: var(--fg2);
      margin-top: 12px;
      min-height: 18px;
    }

    /* ── RESULTADOS ── */
    #resultados {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .res-header {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--fg2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0 2px;
    }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .result-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(26,86,219,0.10);
    }
    .res-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .res-icon.manifesto { background: #d1fae5; color: #059669; }
    .res-icon.factura   { background: #dbeafe; color: #1d4ed8; }
    .res-info { flex: 1; min-width: 0; }
    .res-nombre {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .res-tipo {
      font-size: 0.74rem;
      color: var(--fg2);
      font-weight: 500;
      margin-top: 2px;
    }
    .res-arrow {
      color: var(--fg2);
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    /* ── EMPTY / ERROR ── */
    .msg-empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      color: var(--fg2);
      font-size: 0.88rem;
    }
    .msg-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px 16px;
      color: #b91c1c;
      font-size: 0.88rem;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--fg2);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    @media (max-width: 480px) {
      main { padding: 28px 12px 60px; }
      .search-card { padding: 24px 18px; }
      .search-row { flex-direction: column; }
      .btn-search { width: 100%; justify-content: center; display: flex; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">PDF<span>ocus</span></div>
  {% if empresa %}
  <div class="empresa-badge">
    <span class="dot"></span>
    {{ empresa }}
  </div>
  {% endif %}
</header>

<main>
  <div class="search-card">
    <h1>Buscar referencia</h1>
    <p>Ingresa el código o referencia a localizar en los documentos.</p>

    <div class="search-row">
      <input type="text" id="codigo" placeholder="Ej: S-644WJ, 20250915..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-search" id="btn-buscar" onclick="buscar()">Buscar</button>
    </div>

    <div class="tipo-row">
      <button class="tipo-btn active" data-tipo="ambos" onclick="setTipo(this)">Todos</button>
      <button class="tipo-btn" data-tipo="manifiestos" onclick="setTipo(this)">Manifiestos</button>
      <button class="tipo-btn" data-tipo="facturas" onclick="setTipo(this)">Facturas</button>
    </div>

    <div id="estado"></div>
  </div>

  <div id="resultados"></div>
</main>

<footer>Desarrollado por Felipe Ceballos</footer>

<script>
  let tipoActivo = "ambos";
  const TOKEN = "{{ token }}";

  function setTipo(btn) {
    document.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tipoActivo = btn.dataset.tipo;
  }

  document.getElementById("codigo").addEventListener("keydown", e => {
    if (e.key === "Enter") buscar();
  });

  async function buscar() {
    const codigo = document.getElementById("codigo").value.trim();
    if (!codigo) return;
    const btn = document.getElementById("btn-buscar");
    const estado = document.getElementById("estado");
    const resultados = document.getElementById("resultados");

    btn.disabled = true;
    estado.textContent = "Buscando…";
    resultados.innerHTML = "";

    try {
      const resp = await fetch("/buscar?token=" + TOKEN, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ codigo, tipo: tipoActivo }),
      });
      const data = await resp.json();

      if (data.error) {
        resultados.innerHTML = `<div class="msg-error">${data.error}</div>`;
        estado.textContent = "";
        return;
      }

      const lista = data.resultados || [];
      if (lista.length === 0) {
        resultados.innerHTML = `<div class="msg-empty">No se encontró "<strong>${escHtml(codigo)}</strong>" en ningún documento.</div>`;
        estado.textContent = "";
        return;
      }

      estado.textContent = "";
      resultados.innerHTML = `<div class="res-header">${lista.length} resultado${lista.length > 1 ? "s" : ""}</div>`;
      lista.forEach(r => {
        const es_m = r.tipo === "manifesto" || r.tipo === "manifiestos";
        const url = `/ver_pdf?drive_id=${encodeURIComponent(r.drive_id)}&codigo=${encodeURIComponent(codigo)}&tipo=${encodeURIComponent(r.tipo)}&token=${TOKEN}`;
        resultados.innerHTML += `
          <a class="result-card" href="${url}" target="_blank">
            <div class="res-icon ${es_m ? 'manifesto' : 'factura'}">${es_m ? '📋' : '🧾'}</div>
            <div class="res-info">
              <div class="res-nombre">${escHtml(r.nombre)}</div>
              <div class="res-tipo">${es_m ? 'Manifiesto' : 'Factura'}</div>
            </div>
            <div class="res-arrow">›</div>
          </a>`;
      });
    } catch (err) {
      resultados.innerHTML = `<div class="msg-error">Error de conexión. Intenta de nuevo.</div>`;
      estado.textContent = "";
    } finally {
      btn.disabled = false;
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>

</body>
</html>
